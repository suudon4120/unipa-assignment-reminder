<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { padding: 20px; width: 400px; font-family: sans-serif; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box; }
    button { padding: 8px 15px; cursor: pointer; background-color: #4A154B; color: white; border: none; border-radius: 4px; }
    button:hover { background-color: #361038; }
    #status { margin-top: 10px; color: green; font-size: 0.9em; }
  </style>
</head>
<body>
  <label for="webhookUrl">Slack Webhook URL:</label>
  <input type="text" id="webhookUrl" placeholder="https://hooks.slack.com/services/...">
  
  <button id="save">保存する</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
